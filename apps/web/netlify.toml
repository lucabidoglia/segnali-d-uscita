# App Next.js su Netlify (sito «segnali-uscita-app»). Il prototipo statico ha il suo netlify.toml nella radice del repository.
# Next.js è gestito in automatico dal runtime Netlify (OpenNext).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Runtime Next.js di Netlify (OpenNext): pagine dinamiche, server actions e proxy
[[plugins]]
  package = "@netlify/plugin-nextjs"
