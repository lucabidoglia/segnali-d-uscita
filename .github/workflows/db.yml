name: Sicurezza database
on:
  push:
    paths: ['supabase/migrations/**', 'packages/db/**', '.github/workflows/db.yml']
  pull_request:
    paths: ['supabase/migrations/**', 'packages/db/**', '.github/workflows/db.yml']
jobs:
  rls:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/db/package-lock.json
      - run: npm ci
      - run: npm test
